addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#mExport').classList.contains('show')) { if (!exporting) closeModal('#mExport'); return; }
    if ($('#mKeys').classList.contains('show')) { closeModal('#mKeys'); return; }
  }
  if (typing()) return;
  if (exporting && !(e.ctrlKey || e.metaKey)) return;
  const ctrl = e.ctrlKey || e.metaKey;

  if (ctrl) {
    const k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
    if (k === 'y') { e.preventDefault(); doRedo(); return; }
    if (k === 's') { e.preventDefault(); saveScene(); return; }
    if (k === 'd') { e.preventDefault(); duplicateSel(); return; }
    if (k === 'r') { e.preventDefault(); openExport(); return; }
    if (k === 'a') { e.preventDefault(); select([...S.objects]); return; }
    return;
  }

  switch (e.key) {
    case 'q': case 'Q': setGizmo(null); return;
    case 'w': case 'W': setGizmo('translate'); return;
    case 'e': case 'E': setGizmo('rotate'); return;
    case 'r': case 'R': setGizmo('scale'); return;
    case 'x': case 'X':
      S.space = S.space === 'world' ? 'local' : 'world';
      attachGizmo(); toast('Gizmo space: ' + S.space); return;
    case 'f': case 'F': nav.frame(S.sel); return;
    case 'a': case 'A': nav.frame(S.objects); return;
    case 'v': case 'V':
      setLayout(S.layout === 'single' ? 'vsplit' : S.layout === 'vsplit' ? 'hsplit' : 'single'); return;
    case 'c': case 'C': {
      const o = single();
      if (o && isCam(o)) setLookThrough(S.lookThrough === o ? null : o);
      else if (S.lookThrough) setLookThrough(null);
      else { const c = S.objects.find(isCam); if (c) setLookThrough(c); }
      return;
    }
    case 'g': case 'G': $('#tgGrid').click(); return;
    case 'b': case 'B': $('#tgGate').click(); return;
    case 'h': case 'H': $('#tgGuide').click(); return;
    case 'p': case 'P': $('#tgPath').click(); return;
    case 's': if (e.shiftKey) return; keySelected(); return;
    case 'S': if (e.shiftKey) { pushUndo(); for (const o of S.sel) deleteKeys(o, null); syncInspector(); return; } keySelected(); return;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSelected(); return;
    case 'Escape': select([]); return;
    case ' ': e.preventDefault(); setPlaying(!S.playing); return;
    case 'ArrowLeft': e.preventDefault(); e.shiftKey ? gotoKey(-1) : setFrame(S.cur - 1); return;
    case 'ArrowRight': e.preventDefault(); e.shiftKey ? gotoKey(1) : setFrame(S.cur + 1); return;
    case 'Home': setFrame(S.start); return;
    case 'End': setFrame(S.end); return;
  }
});
function keySelected() {
  if (!S.sel.length) { toast('Nothing selected'); return; }
  pushUndo();
  let n = 0;
  for (const o of S.sel) n += setKeys(o, ['t', 'r', 's'], true);
  toast(n ? 'Keyed ' + S.sel.length + ' object' + (S.sel.length > 1 ? 's' : '') + ' @ ' + S.cur : 'Nothing keyable');
  drawTimeline(); syncInspector();
}

/* ============================================================================
   22 · WIRING
   ========================================================================== */

function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }
function openExport() {
  if (exporting) return;
  buildExportUI();
  $('#expCancel').textContent = 'Cancel';
  $('#expGo').textContent = 'Render';
  $('#expGo').disabled = false;
  openModal('#mExport');
}
function applyWire() {
  for (const o of S.objects) {
    if (isCam(o)) continue;                    // never wireframe the camera bodies
    o.traverse(n => { if (n.isMesh && n.material && 'wireframe' in n.material) n.material.wireframe = S.wire; });
  }
  S.dirty = true;
}
function syncToolbarToggles() {
  $('#tgGrid').classList.toggle('on', S.showGrid);
  $('#tgGate').classList.toggle('on', S.showGate);
  $('#tgGuide').classList.toggle('on', S.showGuides);
  $('#tgPath').classList.toggle('on', S.showPaths);
  $('#tgWire').classList.toggle('on', S.wire);
  $('#tgAuto').classList.toggle('on', S.autokey);
  $('#tgLoop').classList.toggle('on', S.loop);
  for (const b of document.querySelectorAll('[data-lay]')) b.classList.toggle('on', b.dataset.lay === S.layout);
}
function syncTimelineInputs() {
  $('#curFrame').value = S.cur;
  $('#rangeStart').value = S.start;
  $('#rangeEnd').value = S.end;
  $('#fpsSel').value = String(S.fps);
  $('#tlInfo').innerHTML = '<b>' + (S.end - S.start + 1) + '</b> f · <b>' +
    ((S.end - S.start + 1) / S.fps).toFixed(2) + '</b> s';
  drawTimeline();
}

function wire() {
  for (const b of document.querySelectorAll('[data-add]'))
    b.onclick = () => { pushUndo(); const o = addPrimitive(b.dataset.add); select([o]); rebuildOutliner(); toast('Added ' + o.userData.pname); };
  $('#addCam').onclick = () => { pushUndo(); const c = addCamera(); select([c]); rebuildOutliner(); toast('Added ' + c.userData.pname); };
  $('#addNull').onclick = () => { pushUndo(); const n = addNull(); select([n]); rebuildOutliner(); toast('Added ' + n.userData.pname); };
  $('#btnDup').onclick = duplicateSel;
  $('#btnDel').onclick = deleteSelected;
  $('#btnKeys').onclick = () => { buildKeysModal(); openModal('#mKeys'); };
  $('#keysClose').onclick = () => closeModal('#mKeys');
  $('#mKeys').onclick = e => { if (e.target.id === 'mKeys') closeModal('#mKeys'); };
  $('#btnNew').onclick = () => { pushUndo(); newScene(); };
  $('#btnSave').onclick = saveScene;
  $('#btnLoad').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try { pushUndo(); loadScene(JSON.parse(await f.text())); }
    catch (err) { toast('Could not read that file', true); }
    e.target.value = '';
  };
  $('#btnExport').onclick = openExport;
  $('#expCancel').onclick = () => { if (exporting) { exportCancel = true; expLog('stopping…'); } else closeModal('#mExport'); };
  $('#expGo').onclick = runExport;

  for (const [id, key, fn] of [
    ['#tgGrid', 'showGrid', null], ['#tgGate', 'showGate', null],
    ['#tgGuide', 'showGuides', null], ['#tgPath', 'showPaths', refreshAllPaths],
    ['#tgWire', 'wire', applyWire],
  ]) $(id).onclick = () => { S[key] = !S[key]; $(id).classList.toggle('on', S[key]); fn?.(); S.dirty = true; };

  for (const b of document.querySelectorAll('[data-lay]')) b.onclick = () => setLayout(b.dataset.lay);
  $('#povSel').onchange = e => { const c = byId(+e.target.value); if (c) setLookThrough(c); };

  $('#btnPlay').onclick = () => setPlaying(!S.playing);
  $('#btnStart').onclick = () => { setPlaying(false); setFrame(S.start); };
  $('#btnEnd').onclick = () => { setPlaying(false); setFrame(S.end); };
  $('#btnPrev').onclick = () => { setPlaying(false); setFrame(S.cur - 1); };
  $('#btnNext').onclick = () => { setPlaying(false); setFrame(S.cur + 1); };
  $('#btnKey').onclick = keySelected;
  $('#btnKeyDel').onclick = () => { pushUndo(); for (const o of S.sel) deleteKeys(o, null); syncInspector(); };
  $('#tgAuto').onclick = () => { S.autokey = !S.autokey; $('#tgAuto').classList.toggle('on', S.autokey); toast('Auto-key ' + (S.autokey ? 'on' : 'off')); };
  $('#tgLoop').onclick = () => { S.loop = !S.loop; $('#tgLoop').classList.toggle('on', S.loop); };

  $('#curFrame').onchange = e => setFrame(parseInt(e.target.value, 10) || S.start);
  // when the two handles cross, move the *other* one rather than snapping back —
  // typing an end of 5 while start is 200 means "end at 5", not "range 200-201"
  $('#rangeStart').onchange = e => {
    S.start = parseInt(e.target.value, 10) || 1;
    if (S.end <= S.start) S.end = S.start + 1;
    S.cur = clamp(S.cur, S.start, S.end); syncTimelineInputs(); setFrame(S.cur); refreshAllPaths();
  };
  $('#rangeEnd').onchange = e => {
    S.end = parseInt(e.target.value, 10) || 2;
    if (S.end <= S.start) S.start = Math.max(1, S.end - 1);
    S.cur = clamp(S.cur, S.start, S.end); syncTimelineInputs(); setFrame(S.cur); refreshAllPaths();
  };
  $('#fpsSel').onchange = e => { S.fps = parseFloat(e.target.value); EX.fps = S.fps; syncTimelineInputs(); };

  for (const inp of [$('#curFrame'), $('#rangeStart'), $('#rangeEnd')]) {
    dragNum(inp, 1);
    inp.onkeydown = ev => { ev.stopPropagation(); if (ev.key === 'Enter') inp.blur(); };
  }
  for (const b of document.querySelectorAll('[data-giz]'))
    b.onclick = () => setGizmo(b.dataset.giz === 'pick' ? null : b.dataset.giz);
}

function newScene() {
  for (const o of [...S.objects]) removeObject(o);
  S.objects = []; S.sel = []; S.uid = 1; S.lookThrough = null;
  S.cur = 1; S.start = 1; S.end = 120; S.fps = 24;
  S.aspect = 2.39024; S.filmback = 0; S.splitPos = 0.5; S.focusPane = 0;
  S.showGrid = true; S.showGate = true; S.showGuides = false; S.showPaths = false;
  S.wire = false; S.autokey = false; S.space = 'world';
  EX.camId = null; EX.fps = null; EX.aspectMode = 'shot'; EX.height = null;
  UNDO.length = 0; REDO.length = 0;

  addPrimitive('plane', { params: { w: 40, d: 40 }, name: 'Ground' });
  const cube = addPrimitive('box', { params: { w: 2, h: 2, d: 2 }, name: 'Block_A' });
  cube.position.set(-1.6, 1, 0);
  const cyl = addPrimitive('cylinder', { params: { r: 0.7, h: 3.4 }, name: 'Block_B' });
  cyl.position.set(2.2, 1.7, -1.4);
  const fig = addPrimitive('figure', { name: 'Human_ref' });
  fig.position.set(0.4, 0, 2.2);
  const aim = addNull({ pos: [0, 1.4, 0], name: 'Aim_target' });
  const cam = addCamera({ focal: 32, name: 'shotCam_A', pos: [7.5, 1.9, 9] });
  cam.userData.aimId = aim.userData.pvid;

  S.layout = 'single';
  setLookThrough(null);
  select([cam]);
  syncToolbarToggles();
  syncTimelineInputs();
  setFrame(1);
  // a deliberate opening view — auto-framing everything includes the 40 m ground
  // plane and the camera rig, which zooms out until the blockout is unreadable
  persp.position.set(9.5, 6, 12.5);
  persp.userData.pivot.set(0, 1.1, 0);
  persp.up.set(0, 1, 0);
  persp.lookAt(persp.userData.pivot);
  toast('New scene');
}

function init() {
  $('#boot').remove();
  $('#app').hidden = false;      // must be visible before measuring the viewport
  wire();
  buildKeysModal();
  setGizmo('translate');
  newScene();
  resize();
  requestAnimationFrame(tick);
}
init();
</script>
</body>
</html>
